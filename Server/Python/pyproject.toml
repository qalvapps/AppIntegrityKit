[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "app-integrity-verifier"
version = "0.1.0.dev0"
description = "Framework-neutral server verification foundations for AppIntegrityKit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Qalv Apps" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10"
]

[tool.hatch.build.targets.wheel]
packages = ["src/app_integrity"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

